system_config:
  default:
    query_sql: select value from oceanbase.__all_virtual_sys_parameter_stat where name="{name}"
    modify_sql: "alter system set {name}={value}"
  tenant:
    query_sql: select * from oceanbase.__all_virtual_tenant_parameter_info where name like "{name}"
    modify_sql: "alter system set {name}={value} {tenant_where}"
variables:
  default:
    query_sql: "select value from oceanbase.__all_virtual_sys_variable where name = '{name}'"
    modify_sql: "SET GLOBAL {name} = {value}"
exec_sql:
  clean_cache:
    modify_sql: "alter system flush plan cache global"