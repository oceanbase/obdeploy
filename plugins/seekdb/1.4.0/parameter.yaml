- name: data_dir
  name_local: 数据目录
  essential: true
  type: PATH
  min_value: null
  max_value: null
  need_redeploy: true
  description_en: the directory for the data file
  description_local: 存储sstable等数据的目录
  section: SSTABLE
  read_only: true
- name: redo_dir
  name_local: Redo 日志目录
  require: false
  essential: true
  type: PATH
  min_value: null
  max_value: null
  need_redeploy: true
  description_en: Directory for redo and clog files.
  description_local: Redo 和 clog 文件目录。
  section: SSTABLE
  read_only: true
- name: datafile_size
  name_local: 数据文件大小
  require: false
  essential: true
  type: CAPACITY_MB
  default: 0
  min_value: 0M
  max_value: null
  modify_limit: decrease
  section: SSTABLE
  need_restart: false
  description_en: size of the data file. Please enter an capacity, such as 20G
  description_local: 数据文件大小。请输入带容量带单位的整数，如20G
- name: datafile_next
  name_local: 数据文件自增步长
  require: false
  essential: true
  type: CAPACITY_MB
  default: 0
  min_value: 0M
  max_value: null
  modify_limit: decrease
  section: SSTABLE
  need_restart: false
  description_en: the auto extend step. Please enter an capacity, such as 2G
  description_local: 数据文件自增步长。请输入带容量带单位的整数，如2G
- name: datafile_maxsize
  name_local: 数据文件最大空间
  require: false
  essential: true
  type: CAPACITY_MB
  default: 0
  min_value: 0M
  max_value: null
  modify_limit: decrease
  section: SSTABLE
  need_restart: false
  description_en: the auto extend max size. Please enter an capacity, such as 20G
  description_local: 数据文件最大空间。请输入带容量带单位的整数，如20G
- name: datafile_disk_percentage
  require: false
  type: INT
  min_value: 0
  max_value: 99
  modify_limit: decrease
  section: SSTABLE
  need_restart: false
  description_en: the percentage of disk space used by the data files.
  description_local: data_dir所在磁盘将被OceanBase系统初始化用于存储数据，本配置项表示占用该磁盘总空间的百分比
- name: _datafile_usage_upper_bound_percentage
  require: false
  type: INT
  default: 90
  min_value: null
  max_value: null
  section: SSTABLE
  need_restart: false
  description_en: 'the percentage of disk space usage upper bound to trigger datafile extend. Range: [5,99] in integer'
- name: enable_rpc_service
  name_local: rpc网络服务
  require: false
  essential: true
  type: BOOL
  default: false
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: true
  description_en: Enable RPC network service. Must be enabled when using RPC-dependent features such as standby replication.
  description_local: rpc网络服务。部署指定，动态修改无效；重启生效。备库等场景必须开启。
- name: enable_rpc_tls
  name_local: 启用 RPC TLS
  require: false
  essential: true
  type: BOOL
  default: false
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: true
  description_en: Whether to enable TLS for RPC connections. Static effective (restart required).
  description_local: 控制是否启用 RPC 的 TLS。静态生效，需重启。
- name: rpc_port
  name_local: 内部通信端口
  require: true
  essential: true
  type: INT
  default: 2882
  min_value: 1025
  max_value: 65535
  modify_limit: modify
  need_restart: true
  description_en: the port number for RPC protocol.
  description_local: 集群内部通信的端口号
  section: OBSERVER
- name: mysql_port
  name_local: 服务端口
  require: true
  essential: true
  type: INT
  default: 2881
  min_value: 1025
  max_value: 65535
  modify_limit: modify
  need_restart: true
  description_en: port number for mysql connection
  description_local: SQL服务协议端口号
  section: OBSERVER
- name: internal_sql_execute_timeout
  require: false
  type: TIME
  default: 30s
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: the number of microseconds an internal DML request is permitted to execute before it is terminated.
  description_local: 系统内部SQL请求的超时时间
- name: net_thread_count
  require: false
  type: INT
  default: 0
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: true
  description_en: the number of rpc/mysql I/O threads for Libeasy.
  description_local: 网络IO线程数
- name: server_task_queue_size
  require: false
  type: INT
  default: 16384
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'the size of the local server runtime task queue. Range: [1024,+∞)'
- name: memory_budget
  name_local: 逻辑内存预算
  require: false
  essential: true
  type: CAPACITY_MB
  default: 0M
  min_value: 0M
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: Logical memory budget used to size caches and buffers. 0M targets 80% of cgroup or physical memory while reserving at least 1G for the system when possible; the minimum automatic value is 1G.
  description_local: 用于计算缓存和缓冲区大小的逻辑内存预算。0M 表示按 cgroup 或物理内存的 80% 计算，并在条件允许时至少为系统预留 1G；自动值最小为 1G。
- name: memory_limit
  name_local: 已废弃内存配置
  require: false
  essential: false
  type: CAPACITY_MB
  default: 0M
  min_value: 0M
  max_value: null
  section: OBSERVER
  need_restart: true
  description_en: Deprecated compatibility parameter ignored by SeekDB 1.4. OBD rejects explicit use; configure memory_budget
    instead.
  description_local: SeekDB 1.4 仅为兼容而保留且不会用于内存控制，OBD 禁止显式配置，请改用 memory_budget。
- name: kvcache_memory_limit
  name_local: KV Cache 内存上限
  require: false
  type: CAPACITY_MB
  default: 0M
  min_value: 0M
  max_value: 1T
  section: RUNTIME
  need_restart: false
  description_en: Maximum KV cache memory. 0M uses min(1T, 40% of memory_budget).
  description_local: KV Cache 内存上限，0M 表示取 memory_budget 的 40%，最大为 1T。
- name: memstore_memory_limit
  name_local: MemStore 内存上限
  require: false
  type: CAPACITY_MB
  default: 0M
  min_value: 0M
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: Maximum MemStore memory. 0M uses 50% of memory_budget.
  description_local: MemStore 内存上限，0M 表示取 memory_budget 的 50%。
- name: vector_memory_limit
  name_local: 向量模块内存上限
  require: false
  type: CAPACITY_MB
  default: 0M
  min_value: 0M
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: Maximum vector module memory. 0M uses 50% of memory_budget.
  description_local: 向量模块内存上限，0M 表示取 memory_budget 的 50%。
- name: cpu_count
  name_local: 系统CPU总数
  require: false
  essential: true
  type: INT
  default: 0
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: the number of CPUs in the system. If this parameter is set to zero, the number will be detected automatically.
  description_local: 系统CPU总数，如果设置为0，将自动检测。
- name: trace_log_slow_query_watermark
  type: TIME
  default: 1s
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: the threshold of execution time (in milliseconds) of a query beyond which it is considered to be a slow
    query.
  description_local: 执行时间超过该阈值的查询会被认为是慢查询，慢查询的追踪日志会被打印到系统日志中
- name: enable_record_trace_log
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether to always record the trace log.
  description_local: 是否记录追踪日志
- name: max_string_print_length
  require: false
  type: INT
  default: 500
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: truncate very long string when printing to log file
  description_local: 打印系统日志时，单行日志最大长度
- name: enable_record_trace_id
  require: false
  type: BOOL
  default: false
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether record app trace id is turned on.
  description_local: 是否记录应用端设置的追踪ID
- name: enable_rich_error_msg
  require: false
  type: BOOL
  default: false
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether add ip:port, time and trace id to user error message.
  description_local: 是否在客户端消息中添加服务器地址、时间、追踪ID等调试信息
- name: debug_sync_timeout
  require: false
  type: TIME
  default: '0'
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: Enable the debug sync facility and optionally specify a default wait timeout in micro seconds. A zero value
    keeps the facility disabled
  description_local: 打开debug sync调试开关，并设置其超时时间；值为0时，则关闭。
- name: dead_socket_detection_timeout
  require: false
  type: TIME
  default: 3s
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specify a tcp_user_timeout for RFC5482. A zero value makes the option disabled
  description_local: 失效socket检测超时时间
- name: enable_perf_event
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether to enable perf event feature.
  description_local: perf event调试特性开关
- name: schema_history_expire_time
  require: false
  type: TIME
  default: 7d
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: the hour of expire time for schema history
  description_local: 元数据历史数据过期时间
- name: default_compress_func
  require: false
  type: SAFE_STRING
  default: zstd_1.3.8
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: default compress function name for create new table
  description_local: MySQL模式下，建表时使用的默认压缩算法
- name: default_row_format
  require: false
  type: SAFE_STRING
  default: dynamic
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: default row format in mysql mode
  description_local: MySQL模式下，建表时使用的默认行格式
- name: storage_rowsets_size
  require: false
  type: INT
  default: 8192
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: 'the row number processed by vectorized storage engine within one batch. Range: (0,1048576]'
- name: weak_read_version_refresh_interval
  require: false
  type: TIME
  default: 1000ms
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'the time interval to refresh cluster weak read version Range: [50ms, +∞)'
- name: syslog_level
  require: false
  type: SAFE_STRING
  default: EDIAG
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies the current level of logging.
  description_local: 系统日志级别
- name: syslog_io_bandwidth_limit
  require: false
  type: CAPACITY_MB
  default: 5MB
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: Syslog IO bandwidth limitation, exceeding syslog would be truncated. Use 0 to disable ERROR log.
  description_local: 系统日志所能占用的磁盘IO带宽上限，超过带宽的系统日志将被丢弃
- name: diag_syslog_per_error_limit
  require: false
  type: INT
  default: 200
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: DIAG syslog limitation for each error per second, exceeding syslog would be truncated
- name: max_syslog_file_count
  require: false
  essential: true
  type: INT
  default: 2
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies the maximum number of the log files that can co-exist before the log file recycling kicks in.
    Each log file can occupy at most 256MB disk space. When this value is set to 0, no log file will be removed.
  description_local: 系统日志自动回收复用时，最多保留多少个。值0表示不自动清理。
- name: enable_async_syslog
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether use async syslog
  description_local: 是否启用系统日志异步写
- name: syslog_disk_size
  require: false
  type: CAPACITY_MB
  default: 0M
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'the size of disk space used by the syslog files. Range: [0, +∞)'
- name: syslog_compress_func
  require: false
  type: STRING
  default: none
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'compress function name for syslog files, values: none, zstd_1.3.8'
- name: syslog_file_uncompressed_count
  require: false
  type: INT
  default: 0
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'specifies the minimum number of the syslog files that will not be compressed. Each syslog file can occupy
    at most 256MB disk space. When this value is set to 0, all syslog file may be compressed. Range: [0, +∞) in integer'
- name: cache_wash_threshold
  require: false
  type: CAPACITY_MB
  default: 64M
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: size of remaining memory at which cache eviction will be triggered.
  description_local: 触发缓存清理的容量阈值
- name: memory_chunk_cache_size
  require: false
  type: CAPACITY_MB
  default: 0M
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: the maximum size of memory cached by memory chunk cache.
  description_local: 内存分配器缓存的内存块容量。值为0的时候表示系统自适应。
- name: enable_sql_operator_dump
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether sql operators (sort/hash join/material/window function/interm result/...) allowed to write
    to disk
  description_local: 是否允许SQL处理过程的中间结果写入磁盘以释放内存
- name: _chunk_row_store_mem_limit
  require: false
  type: CAPACITY_MB
  default: 0M
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'the maximum size of memory used by ChunkRowStore, 0 means follow operator''s setting. Range: [0, +∞)'
- name: _sort_area_size
  require: false
  type: CAPACITY_MB
  default: 32M
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'size of maximum memory that could be used by SORT. Range: [2M,+∞)'
- name: _hash_area_size
  require: false
  type: CAPACITY_MB
  default: 32M
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'size of maximum memory that could be used by HASH JOIN. Range: [4M,+∞)'
- name: _enable_partition_level_retry
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether allow the partition level retry when the leader changes
- name: _enable_defensive_check
  require: false
  type: INT
  default: 1
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specifies whether allow to do some defensive checks when the query is executed, 0 means defensive check
    is disabled, 1 means normal defensive check is enabled, 2 means more strict defensive check is enabled, such as check
    partition id validity
- name: _sql_insert_multi_values_split_opt
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: True means that the split + batch optimization for inserting multiple rows of the insert values ​​statement
    can be done
- name: _min_malloc_sample_interval
  require: false
  type: INT
  default: 16
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'the min malloc times between two samples, which is not more than _max_malloc_sample_interval. 10000 means
    not to sample any malloc, Range: [1, 10000]'
- name: _max_malloc_sample_interval
  require: false
  type: INT
  default: 256
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: 'the max malloc times between two samples, which is not less than _min_malloc_sample_interval. 1 means to
    sample all malloc, Range: [1, 10000]'
- name: _enable_values_table_folding
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: whether enable values statement folds self params
- name: spill_compression_codec
  require: false
  type: STRING
  default: NONE
  min_value: null
  max_value: null
  section: OBSERVER
  need_restart: false
  description_en: specific the compression algorithm type to compress the spilled data in temp block store during the sql
    execution phase. The supported compression codec is ZSTD. NONE means no compression.The default value is NONE.
- name: max_stale_time_for_weak_consistency
  require: false
  type: TIME
  default: 5s
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: 'the max data stale time that cluster weak read version behind current timestamp,no smaller than weak_read_version_refresh_interval,
    range: [5s, +∞)'
- name: enable_monotonic_weak_read
  require: false
  type: BOOL
  default: false
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: specifies observer supportting atomicity and monotonic order read
- name: server_cpu_quota_min
  require: false
  type: DOUBLE
  default: 0.0
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: the number of minimal vCPUs allocated to the server tenant(a special internal tenant that exists on every
    observer)
  description_local: 系统可以使用的最小CPU配额，将会预留
- name: server_cpu_quota_max
  require: false
  type: DOUBLE
  default: 0.0
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: the number of maximal vCPUs allocated to the server tenant
  description_local: 系统可以使用的最大CPU配额
- name: workers_per_cpu_quota
  require: false
  type: INT
  default: 10
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: the ratio(integer) between the number of system allocated workers vs the maximum number of threads that
    can be scheduled concurrently.
  description_local: 每个CPU配额分配多少个工作线程
- name: _ob_max_thread_num
  require: false
  type: INT
  default: 0
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: 'ob max thread number upper limit of observer thread count. Range: [0, 10000), 0 means no limit.'
- name: cpu_quota_concurrency
  require: false
  type: DOUBLE
  default: 10.0
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: max allowed concurrency for 1 CPU quota
  description_local: 租户每个CPU配额允许的最大并发数
- name: px_workers_per_cpu_quota
  require: false
  type: INT
  default: 10
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: the ratio between the number of system allocated px workers vs the maximum number of threads that can be
    scheduled concurrently.
  description_local: 并行执行工作线程数的比例
- name: undo_retention
  require: false
  type: INT
  default: 1800
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: 'the low threshold value of undo retention. The system retains undo for at least the time specified in this
    config when active txn protection is banned. Range: [0, 4294967295]'
- name: _mvcc_gc_using_min_txn_snapshot
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: specifies enable mvcc gc using active txn snapshot
- name: _rowsets_target_maxsize
  require: false
  type: INT
  default: 524288
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: 'the size of the memory reserved for vectorized sql engine. Range: [262144, 8388608]'
- name: _rowsets_max_rows
  require: false
  type: INT
  default: 256
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: 'the row number processed by vectorized sql engine within one batch. Range: [0, 65535]'
- name: _ctx_memory_limit
  require: false
  type: STRING
  default: ''
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: specifies server runtime context memory limits.
- name: _enable_convert_real_to_decimal
  require: false
  type: BOOL
  default: false
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: specifies whether convert column type float(M,D), double(M,D) to decimal(M,D) in DDL
- name: _enable_decimal_int_type
  require: false
  type: BOOL
  default: true
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
  description_en: specifies wether use decimal_int type as backend for decimal values
- name: _optimizer_ads_time_limit
  require: false
  type: INT
  default: 10
  min_value: null
  max_value: null
  section: RUNTIME
  need_restart: false
